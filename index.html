        let audioCtx = null;
    let audioCadangan = new Audio();
    audioCadangan.preload = "auto";

    function bukaKunciAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function mainkanEfek(jenis) {
      bukaKunciAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(620, now);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    function ucapkan(teks) {
      bukaKunciAudio();
      if (!teks) return;
      try { audioCadangan.pause(); } catch (e) {}

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if ("speechSynthesis" in window) {
        try {
          window.speechSynthesis.cancel();
          const daftarSuara = window.speechSynthesis.getVoices();
          const suaraIndo =
            daftarSuara.find(v => v.lang.toLowerCase().includes('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Gadis'))) ||
            daftarSuara.find(v => v.lang.toLowerCase().includes('id'));

          if (!isMobile || suaraIndo) {
            const u = new SpeechSynthesisUtterance(teks);
            u.lang = "id-ID";
            if (suaraIndo) u.voice = suaraIndo;
            u.rate = 0.96;
            u.pitch = 1.05;
            u.volume = 1.0;
            u.onerror = () => putarSuaraOnline(teks);
            window.speechSynthesis.speak(u);
            return;
          }
        } catch (err) {}
      }
      putarSuaraOnline(teks);
    }

    function putarSuaraOnline(teks) {
      try {
        const bersih = teks.replace(/[^\w\s.,?!-]/gi, '').slice(0, 180);
        audioCadangan.src = `https://googleapis.com{encodeURIComponent(bersih)}`;
        audioCadangan.play().catch(() => {});
      } catch (e) {}
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

    function buatBankMembaca(lvl) {
      const sumber = lvl === 'mudah' ? dataMembacaMudah : (lvl === 'sedang' ? dataMembacaSedang : dataMembacaSulit);
      const semuaKata = sumber.map(item => item);
      return acakArray(sumber).slice(0, 15).map(([emoji, suku, jawaban, petunjuk]) => {
        const pengecoh = acakArray(semuaKata.filter(k => k !== jawaban)).slice(0, 3);
        const opsi = acakArray([jawaban, ...pengecoh]);
        return {
          tanya: `${petunjuk}. Ayo baca kata ini!`,
          visual: `${emoji}<span class='suku-kata'>${suku}</span>`,
          baca: `${petunjuk}. ${suku.replace(/-/g, ' ')}. Kata apakah ini?`,
          opsi: opsi,
          kunci: opsi.indexOf(jawaban)
        };
      });
    }

        function buatBankBerhitung(lvl) {
      const soalList = [];
      const buah = ["🍎", "🍓", "🍊", "🍌", "⭐", "🎈", "🍩", "⚽", "🍬", "🚗"];

      for (let i = 0; i < 15; i++) {
        if (lvl === 'mudah') {
          const a = Math.floor(Math.random() * 9) + 1;
          const b = Math.floor(Math.random() * 9) + 1;
          const hasil = a + b;
          const ikon = buah[i % buah.length];
          const opsi = buatOpsiAngka(hasil, 2, 20);
          soalList.push({
            tanya: `Hitung jumlah ${ikon} semuanya!`,
            visual: `<div class="math-big">${a} + ${b} = ?</div><span class="math-emoji">${ikon.repeat(a)} + ${ikon.repeat(b)}</span>`,
            baca: `Berapa hasil dari ${a} ditambah ${b}?`,
            opsi: opsi,
            kunci: opsi.indexOf(String(hasil))
          });
        } else if (lvl === 'sedang') {
          const a = Math.floor(Math.random() * 30) + 10;
          const b = Math.floor(Math.random() * 20) + 5;
          const hasil = a + b;
          const opsi = buatOpsiAngka(hasil, 15, 65);
          soalList.push({
            tanya: `Jagoan Berhitung! Berapa hasilnya?`,
            visual: `<div class="math-big">${a} + ${b} = ?</div>`,
            baca: `Berapa hasil dari ${a} ditambah ${b}?`,
            opsi: opsi,
            kunci: opsi.indexOf(String(hasil))
          });
        } else {
          const hasil = Math.floor(Math.random() * 41) + 60;
          const a = Math.floor(Math.random() * (hasil - 20)) + 15;
          const b = hasil - a;
          const opsi = buatOpsiAngka(hasil, 50, 100);
          soalList.push({
            tanya: `Tantangan Juara Super (Sampai 100)!`,
            visual: `<div class="math-big">${a} + ${b} = ?</div>`,
            baca: `Tantangan juara! Berapa hasil dari ${a} ditambah ${b}?`,
            opsi: opsi,
            kunci: opsi.indexOf(String(hasil))
          });
        }
      }
      return acakArray(soalList);
    }

    function buatOpsiAngka(benar, min, max) {
      const setOpsi = new Set([benar]);
      while (setOpsi.size < 4) {
        const selisih = [1, -1, 2, -2, 5, -5, 10, -10][Math.floor(Math.random() * 8)];
        const kandidat = benar + selisih;
        if (kandidat >= min && kandidat <= max && kandidat !== benar) {
          setOpsi.add(kandidat);
        }
      }
      return acakArray(Array.from(setOpsi).map(String));
    }

          <div style="font-size:0.82rem; font-weight:700; color:#0284c7; margin-bottom:4px;">${namaLevel(levelAktif)}</div>
          <p style="color:#475569; font-weight:700; font-size:1rem;">${petunjuk}</p>
          <div class="visual-box" style="font-size:3.5rem; padding:10px;"><span class="anim-bounce">${gambar}</span></div>
          <button class="btn-suara" onclick="ucapkan('${kata}. ${petunjuk}')">🔊 Dengar Petunjuk</button>
          <div class="kotak-jawaban">${slotHTML}</div>
          <div class="pilihan-huruf">${tombolHTML}</div>
          <button class="bg-kembali" style="margin-top:12px;" onclick="hapusHuruf()">⌫ Hapus Huruf</button>
        </div>`;
    }

    function pilihHuruf(idx) {
      const [, kata] = daftarSusun[indexSusun];
      if (jawabanSusun.length >= kata.length) return;
      mainkanEfek('klik');
      hurufAcak[idx].dipakai = true;
      jawabanSusun.push(hurufAcak[idx]);
      ucapkan(hurufAcak[idx].huruf);
      renderSusunHuruf();

      if (jawabanSusun.length === kata.length) {
        const hasil = jawabanSusun.map(x => x.huruf).join("");
        if (hasil === kata) {
          bintang++;
          mainkanEfek('benar');
          ucapkan("Hebat! Ini adalah " + kata);
          setTimeout(() => { indexSusun++; muatLevelSusun(); }, 1350);
        } else {
          mainkanEfek('salah');
          ucapkan("Masih kurang tepat, yuk ulangi susunannya!");
          setTimeout(() => { jawabanSusun = []; hurufAcak.forEach(h => h.dipakai = false); renderSusunHuruf(); }, 1150);
        }
      }
    }

    function hapusHuruf() {
      if (jawabanSusun.length === 0) return;
      mainkanEfek('klik');
      const terakhir = jawabanSusun.pop();
      terakhir.dipakai = false;
      renderSusunHuruf();
    }

    let kartuMemori = [], kartuTerbuka = [], jumlahCocok = 0, targetPasang = 6, kunciKlikMemori = false;
    function mulaiGameMemori(lvl) {
      const semuaIkon = ["🐶", "🐱", "🐰", "🐼", "🦁", "🐸", "🐯", "🐵", "🐷", "🐮", "🐧", "🐢", "🐙", "🦋", "🐝", "🐳"];
      targetPasang = lvl === 'mudah' ? 4 : (lvl === 'sedang' ? 6 : 8);
      const ikonTerpilih = acakArray(semuaIkon).slice(0, targetPasang);
      kartuMemori = acakArray([...ikonTerpilih, ...ikonTerpilih])
        .map((emoji, index) => ({ id: index, emoji, terbuka: false, cocok: false }));
      kartuTerbuka = []; jumlahCocok = 0; kunciKlikMemori = false;
      ucapkan(`Ayo temukan ${targetPasang} pasang gambar hewan yang kembar!`);
      renderMemori();
    }

    function renderMemori() {
      let gridHTML = kartuMemori.map((k, idx) => {
        let kelas = "kartu-memori", isi = "❓";
        if (k.cocok) { kelas += " cocok"; isi = k.emoji; }
        else if (k.terbuka) { kelas += " terbuka"; isi = k.emoji; }
        return `<div class="${kelas}" onclick="klikKartuMemori(${idx})">${isi}</div>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilBeranda()">⬅️ Menu</button>
          <div class="star-bar">🧠 Pasangan: ${jumlahCocok} / ${targetPasang}</div>
        </div>
        <div class="card">
          <div style="font-size:0.82rem; font-weight:700; color:#0284c7; margin-bottom:4px;">${namaLevel(levelAktif)}</div>
          <p style="color:#475569; font-weight:700; font-size:0.95rem;">Klik dua kartu untuk mencari hewan yang kembar!</p>
          <div class="memori-grid">${gridHTML}</div>
        </div>`;
    }

    function klikKartuMemori(idx) {
      if (kunciKlikMemori) return;
      const kartu = kartuMemori[idx];
      if (kartu.terbuka || kartu.cocok) return;
      mainkanEfek('klik');
      kartu.terbuka = true;
      kartuTerbuka.push(kartu);
      renderMemori();

      if (kartuTerbuka.length === 2) {
        kunciKlikMemori = true;
        const [k1, k2] = kartuTerbuka;
        if (k1.emoji === k2.emoji) {
          k1.cocok = true; k2.cocok = true; jumlahCocok++;
          kartuTerbuka = []; kunciKlikMemori = false;
          mainkanEfek('benar');
          ucapkan("Yeay! Ketemu pasangannya!");
          renderMemori();

          if (jumlahCocok === targetPasang) {
            setTimeout(() => {
              const pesan = `Wih keren banget! Kamu berhasil menemukan semua ${targetPasang} pasangan hewan dengan ingatan super!`;
              ucapkan(pesan);
              document.getElementById("app").innerHTML = `
                <div class="card">
                  <div style="font-size:3.8rem;" class="anim-bounce">🧠✨</div>
                  <h2 style="color:#0284c7; margin:8px 0;">Ingatan Juara Super!</h2>
                  <p style="font-size:0.95rem; color:#475569; margin-bottom:12px;">${pesan}</p>
                  <button class="btn-aksi" onclick="mulaiGameMemori('${levelAktif}')">🔄 Main Lagi (Hewan Baru)</button>
                  <br><br><button class="bg-kembali" onclick="tampilBeranda()">🏠 Kembali ke Menu</button>
                </div>`;
            }, 900);
          }
        } else {
          setTimeout(() => { k1.terbuka = false; k2.terbuka = false; kartuTerbuka = []; kunciKlikMemori = false; renderMemori(); }, 850);
        }
      }
    }

    tampilBeranda();
  </script>
</body>
</html>
