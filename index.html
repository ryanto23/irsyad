    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function mainkanEfek(jenis) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (jenis === 'benar') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.1);
        osc.frequency.setValueAtTime(783.99, now + 0.2);
        osc.frequency.setValueAtTime(1046.50, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
        osc.start(now);
        osc.stop(now + 0.55);
      } else if (jenis === 'salah') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(150, now + 0.3);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (jenis === 'klik') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      }
    }

    function ucapkan(teks) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const suara = new SpeechSynthesisUtterance(teks);
      suara.lang = "id-ID";
      suara.rate = 0.92;
      suara.pitch = 1.12;
      window.speechSynthesis.speak(suara);
    }

    function acakArray(arr) {
      const salinan = [...arr];
      for (let i = salinan.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
      }
      return salinan;
    }

        function buatBankBerhitung() {
      const soalList = [];
      const buah = ["🍎", "🍓", "🍊", "🍌", "⭐", "🎈", "🍩", "⚽", "🍬", "🚗"];

      for (let i = 0; i < 15; i++) {
        const a = Math.floor(Math.random() * 9) + 1;
        const b = Math.floor(Math.random() * 9) + 1;
        const hasil = a + b;
        const ikon = buah[i % buah.length];
        const opsi = buatOpsiAngka(hasil, 1, 20);
        soalList.push({
          tanya: `Hitung jumlah ${ikon} semuanya!`,
          visual: `<div class="math-big">${a} + ${b} = ?</div><span class="math-emoji">${ikon.repeat(a)} + ${ikon.repeat(b)}</span>`,
          baca: `Berapa hasil dari ${a} ditambah ${b}?`,
          opsi: opsi,
          kunci: opsi.indexOf(String(hasil))
        });
      }

      for (let i = 0; i < 20; i++) {
        const a = Math.floor(Math.random() * 35) + 10;
        const b = Math.floor(Math.random() * 25) + 5;
        const hasil = a + b;
        const opsi = buatOpsiAngka(hasil, 15, 70);
        soalList.push({
          tanya: `Ayo hitung penjumlahan berikut!`,
          visual: `<div class="math-big">${a} + ${b} = ?</div>`,
          baca: `Berapa hasil dari ${a} ditambah ${b}?`,
          opsi: opsi,
          kunci: opsi.indexOf(String(hasil))
        });
      }

      for (let i = 0; i < 15; i++) {
        const hasil = Math.floor(Math.random() * 41) + 60;
        const a = Math.floor(Math.random() * (hasil - 20)) + 15;
        const b = hasil - a;
        const opsi = buatOpsiAngka(hasil, 50, 100);
        soalList.push({
          tanya: `Tantangan Berhitung Sampai 100!`,
          visual: `<div class="math-big">${a} + ${b} = ?</div>`,
          baca: `Tantangan berhitung! Berapa hasil dari ${a} ditambah ${b}?`,
          opsi: opsi,
          kunci: opsi.indexOf(String(hasil))
        });
      }

      return acakArray(soalList);
    }

    function buatOpsiAngka(benar, min, max) {
      const setOpsi = new Set([benar]);
      while (setOpsi.size < 4) {
        const selisih = [1, -1, 2, -2, 5, -5, 10, -10][Math.floor(Math.random() * 8)];
        const kandidat = benar + selisih;
        if (kandidat >= min && kandidat <= max && kandidat !== benar) {
          setOpsi.add(kandidat);
        }
      }
      return acakArray(Array.from(setOpsi).map(String));
    }

    const dataBentukMentah = [

    function buatBankBentuk() {
      const hasil = [];
      const semuaJawaban = [...new Set(dataBentukMentah.map(x => x))];
      for (let putaran = 0; putaran < 2; putaran++) {
        dataBentukMentah.forEach(([emoji, jawaban, tanya]) => {
          const pengecoh = acakArray(semuaJawaban.filter(j => j !== jawaban)).slice(0, 3);
          const opsi = acakArray([jawaban, ...pengecoh]);
          hasil.push({
            tanya: tanya,
            visual: `<span class="anim-bounce" style="font-size:4.2rem;">${emoji}</span>`,
            baca: tanya,
            opsi: opsi,
            kunci: opsi.indexOf(jawaban)
          });
        });
      }
      return acakArray(hasil);
    }

    const bankSusunMentah = [

        let kategoriAktif = "", daftarSoal = [], nomor = 0, bintang = 0, sudahJawab = false;

    function tampilBeranda() {
      window.speechSynthesis && window.speechSynthesis.cancel();
      document.getElementById("app").innerHTML = `
        <div class="card">
          <div style="font-size:3.2rem; margin-bottom:6px;" class="anim-bounce">🦁🐼🦊</div>
          <h2 style="color:#0284c7; margin-bottom:4px;">Ayo Bermain Sambil Belajar!</h2>
          <p style="color:#64748b; font-size:0.95rem;">Semua soal diacak baru setiap kali kamu bermain!</p>
        </div>
        <button class="menu-btn bg-baca" onclick="mulaiBelajar('membaca')">
          <span>🔤 Belajar Membaca</span><span class="badge-jumlah">50 Soal Acak ▶️</span>
        </button>
        <button class="menu-btn bg-hitung" onclick="mulaiBelajar('berhitung')">
          <span>🔢 Berhitung (1 - 100)</span><span class="badge-jumlah">50 Soal Acak ▶️</span>
        </button>
        <button class="menu-btn bg-hewan" onclick="mulaiBelajar('hewan')">
          <span>🦁 Tebak Nama Hewan</span><span class="badge-jumlah">50 Soal Acak ▶️</span>
        </button>
        <button class="menu-btn bg-bentuk" onclick="mulaiBelajar('bentuk')">
          <span>🎨 Bentuk & Warna</span><span class="badge-jumlah">50 Soal Acak ▶️</span>
        </button>
        <button class="menu-btn bg-susun" onclick="mulaiSusunHuruf()">
          <span>🧩 Susun Huruf Kata</span><span class="badge-jumlah">50 Level Acak ▶️</span>
        </button>
        <button class="menu-btn bg-memori" onclick="mulaiGameMemori()">
          <span>🧠 Tebak Gambar Kembar</span><span class="badge-jumlah">Acak ▶️</span>
        </button>`;
    }

    function mulaiBelajar(kat) {
      mainkanEfek('klik');
      kategoriAktif = kat;
      if (kat === 'membaca') daftarSoal = acakArray(buatBankMembaca());
      else if (kat === 'berhitung') daftarSoal = acakArray(buatBankBerhitung());
      else if (kat === 'hewan') daftarSoal = acakArray(buatBankHewan());
      else if (kat === 'bentuk') daftarSoal = acakArray(buatBankBentuk());

      nomor = 0;
      bintang = 0;
      tampilSoal();
    }

    function tampilSoal() {
      if (nomor >= daftarSoal.length) {
        mainkanEfek('benar');
        ucapkan("Luar biasa! Kamu menyelesaikan semua lima puluh soal dengan " + bintang + " bintang!");
        document.getElementById("app").innerHTML = `
          <div class="card">
            <div style="font-size:4.2rem;" class="anim-bounce">🏆🎉</div>
            <h2 style="color:#0284c7; margin:10px 0;">Juara Hebat!</h2>
            <p style="font-size:1.1rem; margin-bottom:12px;">Semua 50 soal berhasil diselesaikan!</p>
            <div class="star-bar" style="font-size:1.5rem; display:inline-block; margin-bottom:14px;">⭐ ${bintang} / ${daftarSoal.length} Bintang</div>
            <br>
            <button class="btn-aksi" onclick="mulaiBelajar('${kategoriAktif}')">🔄 Main Lagi (Soal Baru)</button>
            <br><br>
            <button class="bg-kembali" onclick="tampilBeranda()">🏠 Kembali ke Menu</button>
          </div>`;
        return;
      }

      sudahJawab = false;
      const s = daftarSoal[nomor];
      const persen = Math.round(((nomor) / daftarSoal.length) * 100);
      ucapkan(s.baca);

      let opsiHTML = s.opsi.map((teks, idx) =>
        `<button class="opsi-btn" id="opsi-${idx}" onclick="cekJawaban(${idx})">${teks}</button>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilBeranda()">⬅️ Menu</button>
          <div class="star-bar">⭐ ${bintang} | Soal ${nomor + 1}/${daftarSoal.length}</div>
        </div>
        <div class="progress-wrap"><div class="progress-fill" style="width:${persen}%"></div></div>
        <div class="card">
          <p style="font-size:1.15rem; font-weight:700; color:#334155; margin-bottom:4px;">${s.tanya}</p>
          <button class="btn-suara" onclick="ucapkan('${s.baca.replace(/'/g, "")}')">🔊 Dengarkan Soal</button>
          <div class="visual-box">${s.visual}</div>
          <div class="opsi-grid">${opsiHTML}</div>
        </div>`;
    }

    function cekJawaban(pilihan) {
      if (sudahJawab) return;
      const s = daftarSoal[nomor];
      const btnPilih = document.getElementById("opsi-" + pilihan);

      if (pilihan === s.kunci) {
        sudahJawab = true;
        btnPilih.classList.add("benar");
        bintang++;
        mainkanEfek('benar');
        ucapkan("Benar sekali! Pintar!");
        setTimeout(() => {
          nomor++;
          tampilSoal();
        }, 1150);
      } else {
        btnPilih.classList.add("salah");
        mainkanEfek('salah');
        ucapkan("Ups, coba pilih jawaban lain ya!");
      }
    }

        let daftarSusun = [], indexSusun = 0, jawabanSusun = [], hurufAcak = [];

    function mulaiSusunHuruf() {
      mainkanEfek('klik');
      daftarSusun = acakArray(bankSusunMentah);
      indexSusun = 0;
      bintang = 0;
      muatLevelSusun();
    }

    function muatLevelSusun() {
      if (indexSusun >= daftarSusun.length) {
        mainkanEfek('benar');
        ucapkan("Hebat! Kamu berhasil menyusun semua lima puluh kata!");
        document.getElementById("app").innerHTML = `
          <div class="card">
            <div style="font-size:4rem;" class="anim-bounce">🌟🎓</div>
            <h2 style="color:#0284c7; margin:10px 0;">Jago Mengeja!</h2>
            <p style="font-size:1.1rem; margin-bottom:14px;">Semua 50 kata berhasil kamu susun!</p>
            <button class="btn-aksi" onclick="mulaiSusunHuruf()">🔄 Main Lagi</button>
            <br><br>
            <button class="bg-kembali" onclick="tampilBeranda()">🏠 Kembali ke Menu</button>
          </div>`;
        return;
      }

      const [gambar, kata, petunjuk] = daftarSusun[indexSusun];
      jawabanSusun = [];
      hurufAcak = acakArray(kata.split("").map((h, i) => ({ huruf: h, id: i, dipakai: false })));

      ucapkan(`Susun huruf untuk kata ${kata}. ${petunjuk}`);
      renderSusunHuruf();
    }

    function renderSusunHuruf() {
      const [gambar, kata, petunjuk] = daftarSusun[indexSusun];
      let slotHTML = "";
      for (let i = 0; i < kata.length; i++) {
        const isi = jawabanSusun[i] ? jawabanSusun[i].huruf : "";
        slotHTML += `<div class="slot-huruf ${isi ? 'terisi' : ''}">${isi}</div>`;
      }

      let tombolHTML = hurufAcak.map((obj, idx) =>
        `<button class="btn-huruf" ${obj.dipakai ? 'disabled' : ''} onclick="pilihHuruf(${idx})">${obj.huruf}</button>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilBeranda()">⬅️ Menu</button>
          <div class="star-bar">🧩 Kata ${indexSusun + 1}/${daftarSusun.length}</div>
        </div>
        <div class="card">
          <p style="color:#475569; font-weight:700; font-size:1.1rem;">${petunjuk}</p>
          <div class="visual-box" style="font-size:4rem; padding:12px;"><span class="anim-bounce">${gambar}</span></div>
          <button class="btn-suara" onclick="ucapkan('${kata}. ${petunjuk}')">🔊 Dengar Petunjuk</button>
          <div class="kotak-jawaban">${slotHTML}</div>
          <div class="pilihan-huruf">${tombolHTML}</div>
          <button class="bg-kembali" style="margin-top:16px;" onclick="hapusHuruf()">⌫ Hapus Huruf</button>
        </div>`;
    }

    function pilihHuruf(idx) {
      const [, kata] = daftarSusun[indexSusun];
      if (jawabanSusun.length >= kata.length) return;

      mainkanEfek('klik');
      hurufAcak[idx].dipakai = true;
      jawabanSusun.push(hurufAcak[idx]);
      ucapkan(hurufAcak[idx].huruf);
      renderSusunHuruf();

      if (jawabanSusun.length === kata.length) {
        const hasil = jawabanSusun.map(x => x.huruf).join("");
        if (hasil === kata) {
          mainkanEfek('benar');
          ucapkan("Hebat! Ini adalah " + kata);
          setTimeout(() => {
            indexSusun++;
            muatLevelSusun();
          }, 1250);
        } else {
          mainkanEfek('salah');
          ucapkan("Masih kurang tepat, yuk ulangi susunannya!");
          setTimeout(() => {
            jawabanSusun = [];
            hurufAcak.forEach(h => h.dipakai = false);
            renderSusunHuruf();
          }, 1100);
        }
      }
    }

    function hapusHuruf() {
      if (jawabanSusun.length === 0) return;
      mainkanEfek('klik');
      const terakhir = jawabanSusun.pop();
      terakhir.dipakai = false;
      renderSusunHuruf();
    }

        let kartuMemori = [], kartuTerbuka = [], jumlahCocok = 0, kunciKlikMemori = false;

    function mulaiGameMemori() {
      mainkanEfek('klik');
      const semuaIkon = ["🐶", "🐱", "🐰", "🐼", "🦁", "🐸", "🐯", "🐵", "🐷", "🐮", "🐧", "🐢", "🐙", "🦋", "🐝", "🐳"];
      const ikonTerpilih = acakArray(semuaIkon).slice(0, 6);
      kartuMemori = acakArray([...ikonTerpilih, ...ikonTerpilih])
        .map((emoji, index) => ({ id: index, emoji, terbuka: false, cocok: false }));
      kartuTerbuka = [];
      jumlahCocok = 0;
      kunciKlikMemori = false;
      ucapkan("Ayo temukan enam pasang gambar hewan yang sama!");
      renderMemori();
    }

    function renderMemori() {
      let gridHTML = kartuMemori.map((k, idx) => {
        let kelas = "kartu-memori";
        let isi = "❓";
        if (k.cocok) { kelas += " cocok"; isi = k.emoji; }
        else if (k.terbuka) { kelas += " terbuka"; isi = k.emoji; }
        return `<div class="${kelas}" onclick="klikKartuMemori(${idx})">${isi}</div>`;
      }).join("");

      document.getElementById("app").innerHTML = `
        <div class="top-bar">
          <button class="bg-kembali" onclick="tampilBeranda()">⬅️ Menu</button>
          <div class="star-bar">🧠 Pasangan: ${jumlahCocok} / 6</div>
        </div>
        <div class="card">
          <p style="color:#475569; font-weight:700;">Klik dua kartu untuk mencari hewan yang kembar!</p>
          <div class="memori-grid">${gridHTML}</div>
        </div>`;
    }

    function klikKartuMemori(idx) {
      if (kunciKlikMemori) return;
      const kartu = kartuMemori[idx];
      if (kartu.terbuka || kartu.cocok) return;

      mainkanEfek('klik');
      kartu.terbuka = true;
      kartuTerbuka.push(kartu);
      renderMemori();

      if (kartuTerbuka.length === 2) {
        kunciKlikMemori = true;
        const [k1, k2] = kartuTerbuka;

        if (k1.emoji === k2.emoji) {
          k1.cocok = true;
          k2.cocok = true;
          jumlahCocok++;
          kartuTerbuka = [];
          kunciKlikMemori = false;
          mainkanEfek('benar');
          ucapkan("Yeay! Ketemu pasangannya!");
          renderMemori();

          if (jumlahCocok === 6) {
            setTimeout(() => {
              ucapkan("Selamat! Ingatanmu tajam sekali!");
              document.getElementById("app").innerHTML = `
                <div class="card">
                  <div style="font-size:4rem;" class="anim-bounce">🧠✨</div>
                  <h2 style="color:#0284c7; margin:10px 0;">Ingatan Super Hebat!</h2>
                  <p style="font-size:1.1rem; margin-bottom:14px;">Semua pasangan hewan berhasil ditemukan!</p>
                  <button class="btn-aksi" onclick="mulaiGameMemori()">🔄 Main Lagi (Hewan Baru)</button>
                  <br><br>
                  <button class="bg-kembali" onclick="tampilBeranda()">🏠 Kembali ke Menu</button>
                </div>`;
            }, 900);
          }
        } else {
          setTimeout(() => {
            k1.terbuka = false;
            k2.terbuka = false;
            kartuTerbuka = [];
            kunciKlikMemori = false;
            renderMemori();
          }, 850);
        }
      }
    }

    tampilBeranda();
  </script>
